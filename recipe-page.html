   <h1>Chocolate Cake Recipe</h1>
<p>Today we will learn how to make a simple chocolate cake.</p>
    <h2>Ingredients</h2>
    <ul>
      <li>2 cups flour</li>
      <li>1 cup sugar</li>
      <li>2 eggs</li>
      <li>1 cup milk</li>
    </ul>
    <h2>Instructions</h2>
    <ol>
      <li>Mix all dry ingredients.</li>
      <li>Add eggs and milk.</li>
      <li>Pour into baking pan.</li>
      <li>Bake for 30 minutes.</li>
      </ol>
